name: Cloud Functions CI

on:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
  pull_request:
    branches:
      - main
    paths:
      - 'functions/**'

jobs:
  functions-ci:
    name: Cloud Functions CI (npm ci + TypeScript build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      # Uses package-lock.json for reproducible installs (faster & stricter than npm install)
      - name: Install dependencies
        working-directory: functions
        run: npm ci

      # Compile TypeScript to JavaScript (outDir: lib/ as per tsconfig.json)
      # Strict mode and noUnusedLocals are enabled — build fails on any TS error
      - name: Build TypeScript
        working-directory: functions
        run: npm run build
